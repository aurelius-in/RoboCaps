version: "3.9"
services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.dev
    image: robocaps-api:dev
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
  manip:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.dev
    image: robocaps-manip:dev
    command: python -m uvicorn src.apps.manipulation_service:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
  sim2real:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.dev
    image: robocaps-sim2real:dev
    command: python -m src.apps.sim2real_orchestrator --config configs/sim2real.yaml
    volumes:
      - ../../research/experiments/results:/app/research/experiments/results
