version: "3.9"
services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.dev
    image: robocaps-api:dev
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    runtime: nvidia
