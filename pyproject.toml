[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robocaps"
version = "0.1.0"
description = "Structured Part–Pose Capsules for Robotic Perception"
authors = [{ name = "RoboCaps Contributors" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["capsule networks", "robotics", "perception", "pose"]

[project.scripts]
robocaps-qa-agent = "src.apps.factory_qa_agent:main"
robocaps-sim2real = "src.apps.sim2real_orchestrator:main"

[tool.black]
line-length = 100
target-version = ["py310"]
exclude = [".venv", "build", "dist"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E203", "E501"]
exclude = [".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false


