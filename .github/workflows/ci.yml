name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit trivy
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Tests
        run: |
          pytest -q || true
      - name: Docker build
        run: |
          docker build -f deployment/docker/Dockerfile.dev -t robocaps-api:ci .
      - name: SBOM & Scan (Trivy)
        run: |
          trivy image --exit-code 0 --format table robocaps-api:ci
      - name: Dependency Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt || true
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/robocaps-api
          TAG=${GITHUB_SHA::7}
          docker tag robocaps-api:ci $IMAGE:$TAG
          docker tag robocaps-api:ci $IMAGE:latest
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest
